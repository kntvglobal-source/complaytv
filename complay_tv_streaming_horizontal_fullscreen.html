<!DOCTYPE html>
<html lang="es" class="dark h-full bg-appBg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Complay Streaming TV</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HLS.js for m3u8 streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        appBg: '#081019',
                        accent: '#D2FF01',
                        cardBg: '#052027',
                        cardHover: '#0a353f',
                    }
                }
            }
        }
    </script>
    
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #081019;
            color: #FFFFFF;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }

        /* Custom scrollbar styling */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #081019;
        }
        ::-webkit-scrollbar-thumb {
            background: #052027;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #D2FF01;
        }

        /* Channel logo box styling */
        .channel-logo-box {
            border: 1.5px solid #D2FF01;
            background-color: #000000;
        }

        /* Controls hide transitions */
        .controls-overlay {
            transition: opacity 0.3s ease-in-out, visibility 0.3s ease-in-out;
        }
        .controls-hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Fullscreen container layout */
        .fullscreen-container {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 99999 !important;
            background-color: #000000 !important;
        }

        /* Custom Range Input styling */
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 999px;
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #D2FF01;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(210, 255, 1, 0.6);
        }
        input[type=range]::-moz-range-thumb {
            height: 14px;
            width: 14px;
            border: none;
            border-radius: 50%;
            background: #D2FF01;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(210, 255, 1, 0.6);
        }

        .glass-panel {
            background: rgba(5, 32, 39, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        
        .glass-dark {
            background: rgba(8, 16, 25, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
    </style>
</head>
<body class="bg-appBg text-white min-h-screen flex flex-col max-w-md mx-auto relative antialiased border-x border-gray-900/50">

    <!-- Sticky Main Top Container (Header + Locked Player) -->
    <div class="sticky top-0 z-40 w-full bg-appBg shadow-2xl">
        <!-- Header Bar -->
        <header class="flex items-center justify-between px-4 py-2.5 bg-appBg border-b border-gray-800/60">
            <div class="flex items-center space-x-2">
                <div id="app-logo-container" class="flex items-center space-x-2 cursor-pointer" onclick="scrollToTop()">
                  <img src="https://i.postimg.cc/XYZGj0S0/complay.png" alt="Complay Logo" style="height: 40px;">
                </div>
            </div>
            
            <div class="flex items-center space-x-3">
                <span id="channel-badge" class="text-[10px] bg-cardBg border border-accent/40 text-accent px-2 py-0.5 rounded-full font-mono font-bold">
                    130 CH
                </span>
                <button id="search-btn" class="text-white hover:text-accent transition p-1.5 rounded-lg active:scale-95" title="Buscar Canales">
                    <i class="fa-solid fa-magnifying-glass text-lg"></i>
                </button>
            </div>
        </header>

        <!-- Main Video Player Container (LOCKED top position - will not scroll off screen) -->
        <div id="player-wrapper" class="relative w-full aspect-video bg-black overflow-hidden group select-none">
            <video id="video-player" class="w-full h-full object-contain pointer-events-auto" playsinline crossorigin="anonymous"></video>
            
            <!-- Loading Spinner -->
            <div id="player-loader" class="absolute inset-0 flex flex-col items-center justify-center bg-black/60 backdrop-blur-sm transition-opacity duration-300 pointer-events-none opacity-0">
                <i class="fa-solid fa-circle-notch fa-spin text-accent text-3xl mb-2"></i>
                <span class="text-xs font-semibold text-white/80">Cargando canal...</span>
            </div>

            <!-- Inline Overlay Player Controls -->
            <div id="inline-controls" class="controls-overlay absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-black/60 flex flex-col justify-between p-3">
                <!-- Top Inline Controls -->
                <div class="flex justify-between items-center z-10">
                    <div class="flex items-center space-x-2 overflow-hidden pr-2">
                        <span id="inline-ch-num" class="bg-accent text-black font-extrabold text-[11px] px-1.5 py-0.5 rounded shrink-0">CH 234</span>
                        <span id="inline-ch-name" class="text-xs font-bold text-white truncate max-w-[160px]">COM LIVE</span>
                    </div>
                    <button class="text-white hover:text-accent p-1.5 transition active:scale-90 shrink-0" onclick="toggleCast()" title="Transmitir a TV">
                        <i class="fa-solid fa-chromecast text-lg text-accent"></i>
                    </button>
                </div>
                
                <!-- Center Big Play Button -->
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <button id="center-play-btn" class="pointer-events-auto bg-black/60 border border-accent/40 text-accent p-3.5 rounded-full hover:scale-110 active:scale-95 transition shadow-lg shadow-black/50">
                        <i id="center-play-icon" class="fa-solid fa-pause text-2xl w-6 h-6 flex items-center justify-center"></i>
                    </button>
                </div>

                <!-- Bottom Inline Controls -->
                <div class="flex flex-col gap-1.5 z-10">
                    <div class="flex items-center justify-between text-xs text-white">
                        <div class="flex items-center space-x-4">
                            <button id="fav-btn" class="flex items-center space-x-1.5 text-white hover:text-accent transition active:scale-95">
                                <i id="fav-icon" class="fa-regular fa-heart text-accent text-sm"></i>
                                <span class="text-[11px] font-medium">Favoritos</span>
                            </button>
                            <button id="volume-mute-btn" class="text-accent hover:scale-110 transition p-1">
                                <i id="volume-icon" class="fa-solid fa-volume-high text-sm"></i>
                            </button>
                        </div>
                        <button id="fullscreen-toggle-btn" class="text-accent hover:scale-110 transition p-1 active:scale-90" title="Pantalla completa">
                            <i class="fa-solid fa-expand text-base"></i>
                        </button>
                    </div>
                    <!-- Inline Progress Bar -->
                    <div class="w-full bg-white/20 h-1 rounded-full overflow-hidden cursor-pointer" id="progress-container">
                        <div id="progress-bar" class="bg-accent h-full w-0 transition-all duration-150"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Search Bar Input Drawer -->
    <div id="search-bar-container" class="px-4 pt-3 pb-1 hidden bg-appBg/95 border-b border-gray-800 transition-all">
        <div class="relative flex items-center">
            <i class="fa-solid fa-magnifying-glass absolute left-3 text-accent text-sm"></i>
            <input type="text" id="channel-search-input" placeholder="Buscar canal o número..." class="w-full pl-9 pr-8 py-2 bg-cardBg border border-accent/40 rounded-xl text-white text-xs placeholder-gray-400 focus:outline-none focus:border-accent shadow-inner">
            <button id="clear-search-btn" class="absolute right-2.5 text-gray-400 hover:text-white text-xs hidden">
                <i class="fa-solid fa-circle-xmark"></i>
            </button>
        </div>
    </div>

    <!-- Navigation Tabs (Canales / Programación) -->
    <div class="px-4 my-3 flex gap-3">
        <button id="tab-canales" class="flex-1 py-2.5 rounded-full font-bold text-center bg-accent text-black transition shadow-md">
            Canales
        </button>
        <button id="tab-programacion" class="flex-1 py-2.5 rounded-full font-bold text-center bg-accent text-black transition shadow-md">
            Programación
        </button>
    </div>

    <!-- Channel Scrollable List -->
    <main class="flex-1 px-4 pb-8">
        <div id="channels-list" class="space-y-3">
            <!-- Channel items will be generated dynamically here -->
        </div>

        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-12 text-center">

            <p class="text-sm font-bold text-gray-300">No se encontraron canales</p>
            <p class="text-xs text-gray-500 mt-1">Intenta con otro término de búsqueda</p>
        </div>
    </main>

            <div id="fs-top-bar" class="absolute top-0 left-0 right-0 z-30 flex justify-between items-center p-4 bg-gradient-to-b from-black/90 via-black/50 to-transparent pointer-events-auto">

                        <span>Canales</span>
                    </button>

                    </button>
                    <button id="exit-fs-x" class="text-white hover:text-accent text-2xl p-1.5 transition">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <!-- Middle Player Center Controls -->
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-20">

                </button>
            </div>

            <!-- Fullscreen Side Controls -->
            <div id="fs-left-controls" class="absolute left-4 top-1/2 -translate-y-1/2 z-30 flex flex-col items-center space-y-6 glass-panel p-3 rounded-2xl border border-white/10 pointer-events-auto">
                <button id="fs-fav-btn" class="flex flex-col items-center text-accent hover:scale-110 transition active:scale-90">
                    <i id="fs-fav-icon" class="fa-regular fa-heart text-2xl"></i>
                    <span class="text-[9px] text-white font-bold mt-1">FAV</span>
                </button>

                <div class="h-px w-6 bg-white/20"></div>

                <!-- Volume Slider Control -->
                <div class="flex flex-col items-center space-y-3">
                    <button id="fs-vol-btn" class="text-accent hover:scale-110 transition">
                        <i id="fs-vol-icon" class="fa-solid fa-volume-high text-xl"></i>
                    </button>
                    <div class="h-24 flex items-center justify-center">
                        <input type="range" id="fs-vol-slider" min="0" max="1" step="0.05" value="1" class="w-20 h-1.5 -rotate-90 origin-center accent-accent cursor-pointer">
                    </div>
                </div>
            </div>

            <!-- Bottom Progress & Exit Control -->
            <div id="fs-bottom-bar" class="absolute bottom-0 left-0 right-0 z-30 p-4 bg-gradient-to-t from-black/90 via-black/50 to-transparent flex flex-col space-y-2 pointer-events-auto">
                <div class="w-full flex items-center space-x-3">
                    <span id="fs-current-time" class="text-[10px] text-gray-300 font-mono font-bold">00:00</span>
                    <div class="flex-1 bg-white/20 h-2 rounded-full overflow-hidden cursor-pointer" id="fs-progress-container">
                        <div id="fs-progress-bar" class="bg-accent h-full w-0 transition-all duration-150"></div>
                    </div>
                    <button id="fs-exit-btn" class="flex items-center space-x-1.5 text-accent hover:text-white text-xs font-bold transition px-2 py-1 rounded bg-black/40 border border-accent/30">
                        <i class="fa-solid fa-compress"></i>
                        <span>Salir</span>
                    </button>
                </div>
            </div>

            <!-- Fullscreen Side Channel Drawer -->
            <div id="fs-channel-drawer" class="absolute right-0 top-0 bottom-0 w-80 z-40 glass-dark border-l border-accent/20 flex flex-col transform translate-x-full transition-transform duration-300 ease-out pointer-events-auto shadow-2xl">
                <div class="p-3 border-b border-gray-800 flex justify-between items-center bg-black/40">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-tv text-accent text-sm"></i>
                        <span class="font-bold text-xs tracking-wider text-white">CANALES</span>
                    </div>
                    <button id="fs-close-drawer" class="text-gray-400 hover:text-accent text-lg p-1">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <div class="p-2 border-b border-gray-800/80">
                    <input type="text" id="fs-search-input" placeholder="Buscar canal en pantalla completa..." class="w-full px-3 py-1.5 bg-black/60 border border-gray-700/60 rounded-lg text-xs text-white placeholder-gray-500 focus:outline-none focus:border-accent">
                </div>

                <div id="fs-drawer-channels" class="flex-1 overflow-y-auto p-2 space-y-2">
                    <!-- Channels rendered here in fullscreen mode -->
                </div>
            </div>

        </div>
    </div>

        const volumeIcon = document.getElementById('volume-icon');
        const fsVolBtn = document.getElementById('fs-vol-btn');
        const fsVolIcon = document.getElementById('fs-vol-icon');
        const fsVolSlider = document.getElementById('fs-vol-slider');

        const fsDrawer = document.getElementById('fs-channel-drawer');
        const fsDrawerToggle = document.getElementById('fs-drawer-toggle');
        const fsCloseDrawer = document.getElementById('fs-close-drawer');
        const fsDrawerChannels = document.getElementById('fs-drawer-channels');
        const fsSearchInput = document.getElementById('fs-search-input');

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            renderChannels(channelsData);
            loadChannel(0);
            setupEventListeners();
            startInactivityTimer();
        });

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Render Channel List
        function renderChannels(items) {
            channelsList.innerHTML = '';

            if (items.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            items.forEach((ch) => {
                const globalIndex = channelsData.findIndex(c => c.id === ch.id);
                const isActive = globalIndex === currentChannelIndex;

                const channelEl = document.createElement('div');
                channelEl.className = 'flex items-center gap-3 cursor-pointer group';
                channelEl.onclick = () => loadChannel(globalIndex);

                channelEl.innerHTML = `
                    <div class="w-8 text-right font-semibold text-xs text-white/80 shrink-0">
                        ${ch.number}
                    </div>
                    <div class="w-24 h-20 rounded-2xl channel-logo-box flex items-center justify-center overflow-hidden p-1.5 shrink-0 transition group-hover:scale-105 ${isActive ? 'ring-2 ring-accent' : ''}">
                        <img src="${ch.logo}" alt="${ch.name}" class="w-full h-full object-contain rounded-xl" onerror="this.src='https://placehold.co/120x120/052027/FFFFFF?text=${encodeURIComponent(ch.name)}'">
                    </div>
                    <div class="flex-1 bg-cardBg rounded-2xl p-3 h-20 flex flex-col justify-center border border-transparent group-hover:border-accent/30 transition">
                        <div class="text-accent font-bold text-sm tracking-wide line-clamp-1">${ch.programTitle}</div>
                        <div class="text-white text-xs mt-1 font-medium opacity-90 line-clamp-1">${ch.programSub}</div>
                    </div>
                `;
                channelsList.appendChild(channelEl);
            });

            renderFullscreenDrawerChannels();
        }

        // Render Fullscreen Drawer Channels
        function renderFullscreenDrawerChannels() {
            fsDrawerChannels.innerHTML = '';
            const fsSearch = fsSearchInput.value.trim().toLowerCase();

            const drawerItems = channelsData.filter(ch => {
                if (fsSearch === '') return true;
                return ch.name.toLowerCase().includes(fsSearch) || ch.number.includes(fsSearch);
            });

            drawerItems.forEach((ch) => {
                const globalIndex = channelsData.findIndex(c => c.id === ch.id);
                const isActive = globalIndex === currentChannelIndex;

                const item = document.createElement('div');
                item.className = `flex items-center gap-2.5 p-2 rounded-xl cursor-pointer transition ${isActive ? 'bg-accent text-black font-bold' : 'bg-cardBg/70 text-white hover:bg-cardHover border border-gray-800/60'}`;
                item.onclick = () => {
                    loadChannel(globalIndex);
                    toggleFsDrawer(false);
                };

                item.innerHTML = `
                    <span class="text-[10px] ${isActive ? 'bg-black text-accent' : 'bg-black/60 text-accent'} font-mono px-1.5 py-0.5 rounded shrink-0">${ch.number}</span>
                    <span class="text-xs truncate flex-1">${ch.name}</span>
                    ${isActive ? '<i class="fa-solid fa-play text-black text-xs mr-1"></i>' : ''}
                `;
                fsDrawerChannels.appendChild(item);
            });
        }

        // Load Streaming Channel URL
        function loadChannel(index) {
            if (index < 0 || index >= channelsData.length) return;

            currentChannelIndex = index;
            const channel = channelsData[index];

            inlineChNum.textContent = `CH ${channel.number}`;
            inlineChName.textContent = channel.name;
            fsChNumber.textContent = `CH ${channel.number}`;
            fsChannelName.textContent = channel.name;
            fsProgramTitle.textContent = channel.programTitle;

            updateFavoriteUI(favoriteChannelIds.has(channel.id));

            renderChannels(channelsData);

            const streamUrl = channel.streamUrl || "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8";

            showLoader(true);

            if (Hls.isSupported() && streamUrl.endsWith('.m3u8')) {
                if (hls) {
                    hls.destroy();
                }
                hls = new Hls({ enableWorker: true });
                hls.loadSource(streamUrl);
                hls.attachMedia(videoPlayer);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    videoPlayer.play().then(() => showLoader(false)).catch(() => showLoader(false));
                    updatePlayIcons(true);
                });
                hls.on(Hls.Events.ERROR, () => showLoader(false));
            } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                videoPlayer.src = streamUrl;
                videoPlayer.play().then(() => showLoader(false)).catch(() => showLoader(false));
                updatePlayIcons(true);
            } else {
                videoPlayer.src = streamUrl;
                videoPlayer.play().then(() => showLoader(false)).catch(() => showLoader(false));
            }

            showToast(`Cargando canal ${channel.name}`);
        }

        function showLoader(visible) {
            if (visible) {
                playerLoader.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                playerLoader.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        // Toggle Play / Pause
        function togglePlay() {
            if (videoPlayer.paused) {
                videoPlayer.play();
                updatePlayIcons(true);
            } else {
                videoPlayer.pause();
                updatePlayIcons(false);
            }
        }

        function updatePlayIcons(isPlaying) {
            if (isPlaying) {
                centerPlayIcon.className = "fa-solid fa-pause text-2xl w-6 h-6 flex items-center justify-center";
                fsPlayIcon.className = "fa-solid fa-pause text-3xl w-8 h-8 flex items-center justify-center";
            } else {
                centerPlayIcon.className = "fa-solid fa-play text-2xl ml-0.5 w-6 h-6 flex items-center justify-center";
                fsPlayIcon.className = "fa-solid fa-play text-3xl ml-1 w-8 h-8 flex items-center justify-center";
            }
        }

        // Cambia la orientación solo mientras el reproductor está en pantalla completa.
        async function setFullscreenOrientation(isFullscreen) {
            try {
                if (screen.orientation && screen.orientation.lock && screen.orientation.unlock) {
                    if (isFullscreen) {
                        await screen.orientation.lock('landscape');
                    } else {
                        screen.orientation.unlock();
                    }
                }
            } catch (error) {
                // Algunos navegadores requieren instalar la app o no permiten bloquear orientación.
            }
        }

        // Toggle Fullscreen Overlay Mode
        function toggleFullScreen() {
            isFullscreenMode = !isFullscreenMode;

            if (isFullscreenMode) {
                if (playerWrapper.requestFullscreen) {
                    playerWrapper.requestFullscreen().then(() => {
                        setFullscreenOrientation(true);
                    }).catch(() => {});
                } else if (playerWrapper.webkitRequestFullscreen) {
                    playerWrapper.webkitRequestFullscreen();
                    setFullscreenOrientation(true);
                }
                fullscreenOverlay.classList.remove('hidden');
                playerWrapper.classList.add('fullscreen-container');
                renderFullscreenDrawerChannels();
            } else {
                if (document.exitFullscreen && document.fullscreenElement) {
                    document.exitFullscreen().catch(() => {});
                }
                setFullscreenOrientation(false);
                fullscreenOverlay.classList.add('hidden');
                playerWrapper.classList.remove('fullscreen-container');
                toggleFsDrawer(false);
            }
            resetInactivityTimer();
        }

        function toggleFavoriteCurrent() {
            const curCh = channelsData[currentChannelIndex];
            if (favoriteChannelIds.has(curCh.id)) {
                favoriteChannelIds.delete(curCh.id);
                showToast("Eliminado de Favoritos");
            } else {
                favoriteChannelIds.add(curCh.id);
                showToast("Añadido a Favoritos");
            }
            updateFavoriteUI(favoriteChannelIds.has(curCh.id));
        }

        function updateFavoriteUI(isFav) {
            if (isFav) {
                favIcon.className = "fa-solid fa-heart text-accent text-sm";
                fsFavIcon.className = "fa-solid fa-heart text-2xl text-accent";
            } else {
                favIcon.className = "fa-regular fa-heart text-accent text-sm";
                fsFavIcon.className = "fa-regular fa-heart text-2xl text-accent";
            }
        }

        function toggleFsDrawer(forceState) {
            if (forceState !== undefined) {
                if (forceState) {
                    fsDrawer.classList.remove('translate-x-full');
                } else {
                    fsDrawer.classList.add('translate-x-full');
                }
            } else {
                fsDrawer.classList.toggle('translate-x-full');
            }
        }

        // Controls Auto-Hide Behavior
        function resetInactivityTimer() {
            inlineControls.classList.remove('controls-hidden');
            fullscreenOverlay.classList.remove('controls-hidden');

            clearTimeout(inactivityTimeout);
            inactivityTimeout = setTimeout(() => {
                if (!videoPlayer.paused) {
                    inlineControls.classList.add('controls-hidden');
                    fullscreenOverlay.classList.add('controls-hidden');
                }
            }, 3000);
        }

        function startInactivityTimer() {
            ['mousemove', 'touchstart', 'click', 'keydown'].forEach(evt => {
                document.addEventListener(evt, resetInactivityTimer, { passive: true });
            });
        }

        // Setup All UI Event Listeners
        function setupEventListeners() {
            centerPlayBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
            fsPlayPauseBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
            videoPlayer.addEventListener('click', togglePlay);

            document.getElementById('fullscreen-toggle-btn').addEventListener('click', toggleFullScreen);
            document.getElementById('fs-exit-btn').addEventListener('click', toggleFullScreen);
            document.getElementById('exit-fs-x').addEventListener('click', toggleFullScreen);

            document.addEventListener('fullscreenchange', () => {
                if (document.fullscreenElement) {
                    setFullscreenOrientation(true);
                } else {
                    setFullscreenOrientation(false);
                    if (isFullscreenMode) {
                        isFullscreenMode = false;
                        fullscreenOverlay.classList.add('hidden');
                        playerWrapper.classList.remove('fullscreen-container');
                        toggleFsDrawer(false);
                    }
                }
            });

            favBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleFavoriteCurrent(); });
            fsFavBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleFavoriteCurrent(); });

            videoPlayer.addEventListener('timeupdate', () => {
                if (videoPlayer.duration) {
                    const pct = (videoPlayer.currentTime / videoPlayer.duration) * 100;
                    progressBar.style.width = `${pct}%`;
                    fsProgressBar.style.width = `${pct}%`;

                    const mins = Math.floor(videoPlayer.currentTime / 60);
                    const secs = Math.floor(videoPlayer.currentTime % 60);
                    document.getElementById('fs-current-time').textContent = 
                        `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                }
            });

            const toggleMute = (e) => {
                e.stopPropagation();
                videoPlayer.muted = !videoPlayer.muted;
                const isMute = videoPlayer.muted;
                volumeIcon.className = isMute ? "fa-solid fa-volume-xmark text-sm" : "fa-solid fa-volume-high text-sm";
                fsVolIcon.className = isMute ? "fa-solid fa-volume-xmark text-xl text-red-400" : "fa-solid fa-volume-high text-xl";
                fsVolSlider.value = isMute ? 0 : videoPlayer.volume;
            };

            volumeMuteBtn.addEventListener('click', toggleMute);
            fsVolBtn.addEventListener('click', toggleMute);

            fsVolSlider.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                videoPlayer.volume = val;
                videoPlayer.muted = (val === 0);
                fsVolIcon.className = (val === 0) ? "fa-solid fa-volume-xmark text-xl text-red-400" : "fa-solid fa-volume-high text-xl";
            });

            searchBtn.addEventListener('click', () => {
                searchContainer.classList.toggle('hidden');
                if (!searchContainer.classList.contains('hidden')) {
                    searchInput.focus();
                }
            });

            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase().trim();
                clearSearchBtn.classList.toggle('hidden', term.length === 0);
                const filtered = channelsData.filter(ch => 
                    ch.name.toLowerCase().includes(term) || ch.number.includes(term)
                );
                renderChannels(filtered);
            });

            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                clearSearchBtn.classList.add('hidden');
                renderChannels(channelsData);
            });

            fsSearchInput.addEventListener('input', () => {
                renderFullscreenDrawerChannels();
            });

            fsDrawerToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleFsDrawer();
            });

            fsCloseDrawer.addEventListener('click', () => {
                toggleFsDrawer(false);
            });

            document.getElementById('tab-canales').addEventListener('click', function() {
                renderChannels(channelsData);
                showToast("Mostrando Lista de Canales");
            });
            document.getElementById('tab-programacion').addEventListener('click', function() {
                showToast("Guía de Programación");
            });
        }

        function toggleCast() {
            showToast("Buscando dispositivos Chromecast...");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
